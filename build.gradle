// Modified in the soffensive/jwt-reauth fork (2026): add session-profile checks,
// bundle runtime dependencies, and package project and third-party license notices.
plugins {
    id 'java'
}

group = 'com.nccgroup'
version = '1.0.1'

repositories {
    mavenCentral()
}

// Any JDK 17+ can run the build; the JAR targets Java 17, the oldest runtime Burp has bundled since 2023.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

dependencies {
    compileOnly 'net.portswigger.burp.extender:burp-extender-api:2.3'
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'net.portswigger.burp.extender:burp-extender-api:2.3'
    // Only @NotNull documentation annotations are used; missing annotations are ignored at runtime.
    compileOnly 'javax.validation:validation-api:2.0.1.Final'
}

sourceSets {
    test { java { srcDirs = ['tests'] } }
    main {
        java {
            srcDirs = ['src']
        }
    }
}

tasks.withType(Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(files('LICENSE.txt', 'NOTICE', 'THIRD_PARTY_NOTICES.md')) {
        into 'META-INF'
    }
    from('licenses') {
        into 'META-INF/licenses'
    }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    destinationDirectory = file("$rootDir/releases")
}

// These assertion-based checks run without a test framework or network services.
tasks.register('profileChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.nccgroup.jwtreauth.SessionProfilesTest'
    enableAssertions = true
    systemProperty 'java.awt.headless', 'true'
}
check.dependsOn profileChecks
// No test framework is used, and Gradle 9 fails a test task that discovers no tests.
tasks.named('test') { enabled = false }
