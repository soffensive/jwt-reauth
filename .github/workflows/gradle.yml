# This workflow will build a Java project with Gradle
# For more information see: https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    # The wrapper JAR is not committed (*.jar is ignored), so install the wrapper's Gradle version directly.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '7.1'
    - name: Build and run profile checks
      run: gradle build
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: jwt-reauth
        path: releases
