# This workflow will build a Java project with Gradle
# For more information see: https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    # Caches Gradle and validates the committed wrapper JAR.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Build and run profile checks
      run: ./gradlew build
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: jwt-reauth
        path: releases
